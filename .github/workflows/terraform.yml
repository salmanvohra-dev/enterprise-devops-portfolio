name: "Enterprise Terraform CI/CD"

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code to the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform CLI on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5" # Apne version ke hisab se adjust kar sakte ho

      # 3. Configure AWS Credentials using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Apna region dal dena (e.g., ap-south-1)

      # 4. Terraform Init (Initializes S3 backend and DynamoDB locking)
      - name: Terraform Init
        run: terraform init
        working-directory: ./project1

      # 5. Terraform Validate (Checks syntax)
      - name: Terraform Validate
        run: terraform validate

      # 6. Terraform Plan (Generates execution plan)
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: false

      # 7. Terraform Apply (Runs only on Push to master/main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve